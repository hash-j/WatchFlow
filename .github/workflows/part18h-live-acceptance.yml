name: Part 18H live acceptance

on:
  workflow_dispatch:
    inputs:
      confirm_watchflow_dev:
        description: Run guarded browser acceptance against watchflow-dev
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: part18h-watchflow-dev
  cancel-in-progress: false

jobs:
  guarded-watchflow-dev:
    if: ${{ inputs.confirm_watchflow_dev == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: watchflow-dev
    env:
      CI: true
      E2E_TARGET_ENV: development
      E2E_EXPECTED_SUPABASE_PROJECT_REF: ckwadpmvxieekjlsfcks
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_WEB_SERVER_COMMAND: npm run start
      RUN_SUPABASE_INTEGRATION_TESTS: true
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.WATCHFLOW_DEV_SUPABASE_URL }}
      E2E_EXPECTED_SUPABASE_URL: ${{ secrets.WATCHFLOW_DEV_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.WATCHFLOW_DEV_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.WATCHFLOW_DEV_SUPABASE_SECRET_KEY }}
      TMDB_READ_ACCESS_TOKEN: ${{ secrets.WATCHFLOW_DEV_TMDB_READ_ACCESS_TOKEN }}
      E2E_USER_A_EMAIL: ${{ secrets.WATCHFLOW_DEV_QA_USER_A_EMAIL }}
      E2E_USER_A_PASSWORD: ${{ secrets.WATCHFLOW_DEV_QA_USER_A_PASSWORD }}
      E2E_USER_B_EMAIL: ${{ secrets.WATCHFLOW_DEV_QA_USER_B_EMAIL }}
      E2E_USER_B_PASSWORD: ${{ secrets.WATCHFLOW_DEV_QA_USER_B_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify pinned development target and Part 18H schema
        run: node scripts/verify-part18h-ci-target.mjs

      - name: Run focused Part 18H tests
        run: >-
          npx vitest run
          lib/notifications/actions.test.ts
          lib/notifications/mapping.test.ts
          lib/notifications/presentation.test.ts
          lib/notifications/ui-contract.test.ts
          lib/notifications/part18h-migration-contract.test.ts
          lib/release/part18h-ci-preflight.test.ts
          lib/settings/actions.test.ts
          lib/settings/security-contract.test.ts
          lib/settings/supabase-settings.test.ts
          lib/settings/validation.test.ts

      - name: Run guarded Part 18H database integration
        run: >-
          npx vitest run
          --config vitest.integration.config.ts
          integration/part18h-notifications.integration.test.ts

      - name: Run full Vitest suite
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Check whitespace errors
        run: git diff --check

      - name: Build production application
        run: npm run build

      - name: Scan browser artifacts for server secrets
        run: npm run scan:client-secrets

      - name: Install Chrome for guarded browser acceptance
        run: npx playwright install --with-deps chrome

      - name: Run existing notification producer acceptance serially
        run: npx playwright test e2e/part18c-notifications.spec.ts --workers=1

      - name: Run Part 18H notification-center acceptance serially
        run: npx playwright test e2e/part18h-notification-center.spec.ts --workers=1

      - name: Upload redacted browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: part18h-browser-diagnostics
          path: |
            qa-artifacts/playwright-report
            qa-artifacts/playwright-test-results
          if-no-files-found: ignore
          retention-days: 7
