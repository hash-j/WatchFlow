name: Release quality gates

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  non-live-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: watchflow-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-public-placeholder
      E2E_BASE_URL: http://127.0.0.1:3000
      E2E_WEB_SERVER_COMMAND: npm run start
      PGPASSWORD: watchflow-ci-only

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Rebuild database from version-controlled migrations
        shell: bash
        run: |
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f supabase/testing/from_zero_bootstrap.sql
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
              -f "$migration"
          done
          verification_output="$(psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -U postgres -d postgres \
            -f supabase/verification/development_readiness.sql)"
          printf '%s\n' "$verification_output"
          if grep -q 'MISSING' <<<"$verification_output"; then
            exit 1
          fi
          security_output="$(psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 \
            -U postgres -d postgres \
            -f supabase/verification/production_security_audit.sql)"
          printf '%s\n' "$security_output"
          if grep -Eq 'MISSING|UNSAFE|ENABLED_UNEXPECTEDLY' \
            <<<"$security_output"; then
            exit 1
          fi
          psql -X -v ON_ERROR_STOP=1 -h 127.0.0.1 -U postgres -d postgres \
            -f supabase/testing/part18a_queue_normalization.sql

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run unit and source tests
        run: npm test

      - name: Build production application
        run: npm run build

      - name: Scan browser artifacts for server secrets
        run: npm run scan:client-secrets

      - name: Install Chrome for public browser checks
        run: npx playwright install --with-deps chrome

      - name: Run public responsive browser checks
        run: npx playwright test e2e/responsive.spec.ts
